version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=otel-bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token

  otel-gateway:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-gateway
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-gateway-config.yaml:/etc/otel-collector-config.yaml
    # We remove host port mapping to allow scaling without conflicts
    # For local access to a single instance, use -p 4317:4317
    expose:
      - "4317"
      - "4318"
    depends_on:
      - influxdb

  otel-test-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-test-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-test-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - otel-gateway

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
