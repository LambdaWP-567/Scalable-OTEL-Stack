replicaCount: 1

gateway:
  image: otel/opentelemetry-collector-contrib:latest
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

testCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:latest

influxdb:
  image: influxdb:2.7
  adminToken: "my-super-secret-auth-token"
  org: "my-org"
  bucket: "otel-bucket"
  password: "password123"

grafana:
  image: grafana/grafana:latest
